{% extends "layout.html" %}

{% block extra_head %}
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
{% endblock %}

{% block content %}
<div class="chart-section">
    

    <div id="chart"></div>
    <div id="loading" class="loading-indicator">Loading chart data...</div>
</div>

<div class="search-section">
    <div id="controls">
        <div class="control-group" id="symbol-g">
            <label for="symbol">Symbol:</label>
            <input id="symbol" type="text" value="ES" />
            <button onclick="fillConIDs()">Get ConIDs</button>
            <button onclick="listContractsID()">List Contracts IDs</button>
        </div>
        <div class="control-group" id="conid-g">
            <label for="baseConid">Base Conid:</label>
            <input id="baseConid" type="text" value="{{ conid }}" placeholder="Current ConID" />
            <label for="conid">Conid:</label>
            <input id="conid" type="text" value="{{ conid }}" placeholder="Current ConID" />
            <button onclick="loadChart()">Load ConID's Chart</button>
        </div>
    </div>
</div>
<div class="futures-section">
    <div id="controls">
        <div class="control-group" id="long-fut">
            <label for="long-entry">Long Entry:</label>
            <input id="long-entry" type="text" placeholder="Enter price" />
            <select name="LE-ordertype" id="LE-ordertype">
                <option value="LMT">LMT</option>
                <option value="STP">STP</option>
            </select>
            <label for="long-entry-stop">Stop Loss:</label>
            <input id="long-entry-stop" type="text" placeholder="Enter price" />
            <label for="long-entry-target">Profit Target:</label>
            <input id="long-entry-target" type="text" placeholder="Enter price" />
            <button onclick="longFutures()">Submit LE Bracket Order</button>
        </div>
        <div class="control-group" id="short-fut">
            <label for="short-entry">Short Entry:</label>
            <input id="short-entry" type="text" placeholder="Enter price" />
            <select name="LE-ordertype" id="LE-ordertype">
                <option value="LMT">LMT</option>
                <option value="STP">STP</option>
            </select>
            <label for="short-entry-stop">Stop Loss:</label>
            <input id="short-entry-stop" type="text" placeholder="Enter price" />
            <label for="short-entry-target">Profit Target:</label>
            <input id="short-entry-target" type="text" placeholder="Enter price" />
            <button onclick="shortFutures()">Submit SE Bracket Order</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', path='renderChart.js') }}"></script>
<script>
    async function fillConIDs() {
        // update baseConidInput and conidInput by sending symbolInput.value to endpoint '/fillForm'
        const symbolInput = document.getElementById('symbol');
        if (!symbolInput) return;
        const symbol = symbolInput.value.trim();
        if (!symbol) return;

        try {
            const response = await fetch(`/fillConIDsInputs?symbol=${encodeURIComponent(symbol)}`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            if (data) {
                if (data.baseConid !== undefined && data.baseConid !== null) {
                    const baseConidInput = document.getElementById('baseConid');
                    if (baseConidInput) {
                        baseConidInput.value = data.baseConid;
                    }
                }
                if (data.front_month_conid !== undefined && data.front_month_conid !== null) {
                    const conidInput = document.getElementById('conid');
                    if (conidInput) {
                        conidInput.value = data.front_month_conid;
                    }
                }
            }
        } catch (err) {
            console.error("Error prefilling form:", err);
        }
    }

    function listContractsID() {
        const symbol = document.getElementById('symbol').value.trim();
        const query = encodeURIComponent(symbol);
        window.open(`/get-conids?symbol=${query}`, '_blank', 'noopener,noreferrer');
    }
</script>
{% endblock %}
