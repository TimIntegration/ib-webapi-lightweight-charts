<div class="futures-section">

            <label for="fut-entry-target">Profit Target:</label>

            <label for="fut-entry-size">Quantity:</label>

            <button id="fill-fut-entry" onclick="fillFuturesEntry()">Calculate Entry</button>
            <label for="fut-tp-entry-plus-stop">Take profit on half at entry + stop</label>
            <input type="checkbox" id="fut-tp-entry-plus-stop">
            <label for="fut-tp-half-then-trail">Take profit on half at target then trailing stop on the rest</label>
            <input type="checkbox" id="fut-tp-half-then-trail" checked>
            <label for="fut-time-stop-profit">Time stop at profit (minutes):</label>

{% block extra_scripts %}
<script src="{{ url_for('static', path='renderChart.js') }}"></script>
<script>
    async function fillConIDs() {
        const symbolInput = document.getElementById('symbol');
        if (!symbolInput) return;
        const symbol = symbolInput.value.trim();
        if (!symbol) return;

        try {
            const response = await fetch(`/fillConIDsInputs?symbol=${encodeURIComponent(symbol)}`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            if (data) {
                const underlyingVal = data.underlyingConid ?? data.baseConid ?? data.underlying_conid;
                if (underlyingVal !== undefined && underlyingVal !== null) {
                    const underlyingConidInput = document.getElementById('underlyingConid');
                    if (underlyingConidInput) {
                        underlyingConidInput.value = underlyingVal;
                    }
                }
                const frontMonthVal = data.front_month_conid ?? data.conid;
                if (frontMonthVal !== undefined && frontMonthVal !== null) {
                    const conidInput = document.getElementById('conid');
                    if (conidInput) {
                        conidInput.value = frontMonthVal;
                    }
                }
            }
        } catch (err) {
            console.error("Error prefilling form:", err);
        }
    }

    async function fillFuturesEntry() {
        const entryInput = document.getElementById('fut-entry');
        const stopInput = document.getElementById('fut-entry-stop');
        const targetInput = document.getElementById('fut-entry-target');
        const directionSelect = document.getElementById('fut-order-direction');
        const bracketButton = document.getElementById('fut-bracket-btn');

        if (!entryInput || !stopInput || !targetInput) {
            return;
        }

        if (!entryInput.value || entryInput.value.trim() === '') {
            let defaultPrice = '7730.00';
            try {
                const storedPrice = localStorage.getItem('fut-entry-default');
                if (storedPrice !== null && storedPrice !== '') {
                    defaultPrice = storedPrice;
                }
            } catch (err) {
                console.warn('Unable to load default futures entry price from localStorage:', err);
            }
            entryInput.value = defaultPrice;
        }

        const entryPrice = Number(entryInput.value);
        if (Number.isNaN(entryPrice)) {
            return;
        }

        const model = await window.getModel ? window.getModel() : {};
        const direction = directionSelect ? directionSelect.value : 'long';
        const longStopFactor = Number(model?.longStopFactor ?? 0.004);
        const shortStopFactor = Number(model?.shortStopFactor ?? 0.004);
        const longTargetFactor = Number(model?.longTargetFactor ?? 0.008);
        const shortTargetFactor = Number(model?.shortTargetFactor ?? 0.008);

        if (direction === 'short') {
            stopInput.value = (entryPrice * (1 + shortStopFactor)).toFixed(2);
            targetInput.value = (entryPrice * (1 - shortTargetFactor)).toFixed(2);
        } else {
            stopInput.value = (entryPrice * (1 - longStopFactor)).toFixed(2);
            targetInput.value = (entryPrice * (1 + longTargetFactor)).toFixed(2);
        }
        // Calculate and display
        const multiplier = Number(model?.contractSize ?? 50);
        changeCapitalAtRisk(multiplier);
    }

    function changeCapitalAtRisk(multiplier_per_point = 50) {
        let quantity = parseFloat(document.getElementById('fut-entry-size').value) * multiplier_per_point;
        const entryPrice = parseFloat(document.getElementById('fut-entry').value);
        const stopPrice = parseFloat(document.getElementById('fut-entry-stop').value);
        const targetPrice = parseFloat(document.getElementById('fut-entry-target').value);

        if (isNaN(entryPrice) || isNaN(stopPrice) || isNaN(targetPrice)) {
            document.getElementById('capital-at-risk').textContent = 'Invalid input';
            document.getElementById('return-on-risk').textContent = 'Invalid input';
            return;
        }

        const capitalAtRisk = Math.abs(entryPrice - stopPrice) * quantity;
        let returnOnRisk = 0;
        if (capitalAtRisk !== 0) {
            returnOnRisk = Math.abs(targetPrice - entryPrice) * quantity / capitalAtRisk;
        }
        const takeProfitOnHalfAtEntryPlusStop = document.getElementById('fut-tp-entry-plus-stop').checked;
        if (takeProfitOnHalfAtEntryPlusStop) {
            const returnAtTP1 = Math.abs(entryPrice - stopPrice) * quantity / 2;
            const returnAtTP2 = Math.abs(targetPrice - entryPrice) * quantity / 2;
            const averageReturn = returnAtTP1 + returnAtTP2;
            returnOnRisk = capitalAtRisk === 0 ? 0 : averageReturn / capitalAtRisk;
        }

        document.getElementById('capital-at-risk').textContent = `$${capitalAtRisk.toFixed(2)}`;
        document.getElementById('return-on-risk').textContent = Number.isFinite(returnOnRisk) ? returnOnRisk.toFixed(2) : '0.00';
    }

    const futEntryInput = document.getElementById('fut-entry');
    const futStopInput = document.getElementById('fut-entry-stop');
    const futTargetInput = document.getElementById('fut-entry-target');
    const futEntrySizeInput = document.getElementById('fut-entry-size');
    [futEntryInput, futStopInput, futTargetInput, futEntrySizeInput].forEach((input) => {
        if (!input) return;
        input.addEventListener('input', changeCapitalAtRisk);
        input.addEventListener('change', changeCapitalAtRisk);
    });
    const futTakeProfitFlags = document.querySelectorAll('#fut-tp-entry-plus-stop, #fut-tp-half-then-trail');
    futTakeProfitFlags.forEach((checkbox) => {
        checkbox.addEventListener('change', changeCapitalAtRisk);
    });





    function listContractsID() {
        const symbol = document.getElementById('symbol').value.trim();
        const query = encodeURIComponent(symbol);
        window.open(`/get-conids?symbol=${query}`, '_blank', 'noopener,noreferrer');
    }
</script>
