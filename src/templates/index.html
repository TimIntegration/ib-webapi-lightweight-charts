{% extends "layout.html" %}

{% block extra_head %}

{% block content %}

    <div id="chart"></div>

</div>

<div class="search-section">

        </div>
    </div>
</div>
<div class="futures-section">

        <div class="control-group" id="long-fut">
            <label for="long-entry">Long Entry:</label>
            <input id="long-entry" type="text" placeholder="Enter price" />
            <select name="LE-ordertype" id="LE-ordertype">
                <option value="LMT">LMT</option>
                <option value="STP">STP</option>
            </select>
            <label for="long-entry-stop">Stop Loss:</label>
            <input id="long-entry-stop" type="text" placeholder="Determine Size" />
            <label for="long-entry-target">Profit Target:</label>
            <input id="long-entry-target" type="text" placeholder="Fill by Algo" />
            <label for="long-entry-size">Quantity:</label>
            <input id="long-entry-size" type="text" value="1" />
            <button id="fill-long-entry" onclick="fillLongEntry()">Calculate Entry</button>

        </div>
        <div class="control-group" id="short-fut">

            <label for="short-entry-stop">Stop Loss:</label>

            <label for="short-entry-target">Profit Target:</label>
            <input id="short-entry-target" type="text" placeholder="Fill by Algo" />
            <label for="short-entry-size">Quantity:</label>

            <button id="fill-short-entry" onclick="fillShortEntry()">Calculate Entry</button>

</div>

{% block extra_scripts %}
<script src="{{ url_for('static', path='renderChart.js') }}"></script>
<script>
    async function fillConIDs() {
        const symbolInput = document.getElementById('symbol');
        if (!symbolInput) return;
        const symbol = symbolInput.value.trim();
        if (!symbol) return;

        try {
            const response = await fetch(`/fillConIDsInputs?symbol=${encodeURIComponent(symbol)}`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            if (data) {
                const underlyingVal = data.underlyingConid ?? data.baseConid ?? data.underlying_conid;
                if (underlyingVal !== undefined && underlyingVal !== null) {
                    const underlyingConidInput = document.getElementById('underlyingConid');
                    if (underlyingConidInput) {
                        underlyingConidInput.value = underlyingVal;
                    }
                }
                const frontMonthVal = data.front_month_conid ?? data.conid;
                if (frontMonthVal !== undefined && frontMonthVal !== null) {
                    const conidInput = document.getElementById('conid');
                    if (conidInput) {
                        conidInput.value = frontMonthVal;
                    }
                }
            }
        } catch (err) {
            console.error("Error prefilling form:", err);
        }
    }

    function listContractsID() {
        const symbol = document.getElementById('symbol').value.trim();
        const query = encodeURIComponent(symbol);
        window.open(`/get-conids?symbol=${query}`, '_blank', 'noopener,noreferrer');
    }
</script>
